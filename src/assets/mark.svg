<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The stackumi mark: three plates on a rising diagonal, the top one lit. Grid 64, plates 34,
       corner 9, step 11. Colours come from CSS custom properties set by the page. -->
  <defs>
    <radialGradient id="lit" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="var(--light)" stop-opacity=".32"/>
      <stop offset="1" stop-color="var(--light)" stop-opacity=".08"/>
    </radialGradient>
  </defs>
  <rect class="pl" x="4" y="26" width="34" height="34" rx="9"/>
  <rect class="pl" x="15" y="15" width="34" height="34" rx="9"/>
  <rect class="pl top" x="26" y="4" width="34" height="34" rx="9" fill="url(#lit)"/>
</svg>
